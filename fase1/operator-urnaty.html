<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let hasil = +1
        document.writeln(hasil + "</br>")

        hasil--
        document.writeln(hasil + "</br>")

        hasil++
        document.writeln(hasil + "</br>")

        hasil = -hasil
        document.writeln(hasil + "</br>")
    </script>
</body>
</html>
