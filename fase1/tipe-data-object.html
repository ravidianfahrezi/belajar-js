<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipe Data Object</title>
</head>
<body>
    <script>
        const person = {}

        // key - value
        person["nama"] = "Rayyan"
        person["alamat"] = "Sampang"
        person["umur"] = 70
        console.table(person)

        delete person["umur"]
        console.table(person)

        const orang = {
            "nama lengkap" : "Rayyan",
            alamat : "Bangkalan",
            umur : 20
        }

        console.info(`Nama : ${orang["nama lengkap"]}`)
        console.info(`Alamat : ${orang.alamat}`)
        console.info(`Umur : ${orang.umur}`)
    </script>
</body>
</html>
