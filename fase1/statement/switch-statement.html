<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statement</title>
</head>
<body>
    <script>
        const nilai = "E"
        switch (nilai) {
            case "A":
                document.writeln("<p>Kau hebat bg</p>")
                break
            case "B":
            case "C":
                document.writeln("<p>Lulus kau bg</p>")
                break
            case "D":
                document.writeln("<p>NT bg NT</p>")
                break
            default:
                document.writeln("<p>Ganti jurusan aja bg</p>")
        }
    </script>
</body>
</html>
