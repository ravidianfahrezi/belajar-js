<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Statement</title>
</head>
<body>
    <script>
        const value = 80

        if (value > 90) {
            document.writeln("<p>Lulus kau bg</p>")
        }else if (value >75) {
            document.writeln("<p>Parak kau bg</p>")
        } else {
            document.writeln("<p>Bodoh kau bg</p>")
        }
    </script>
</body>
</html>
