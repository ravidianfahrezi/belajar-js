<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Augmanted Assigment</title>
</head>
<body>
    <script>
        let hasil = 1 + 2
        document.writeln(hasil + "</br>")

        hasil -= 2
        document.writeln(hasil + "</br>")

        hasil *= 4
        document.writeln(hasil + "</br>")
    </script>
</body>
</html>
