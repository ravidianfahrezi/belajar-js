<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function di Object</title>
</head>
<body>
    <script>
        const person = {
            name: "Eko",
            sayHello: (name) => {
                console.info(this)
                console.info(`Hello ${name}, My Name is ${this.name}`)
            }
        }

        person.sayHello("Budi")
    </script>
</body>
</html>
