<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator In</title>
</head>
<body>
    <script>
        const orang = {
            firstName: "Ravi",
            lastName: "Fahrezi"
        }

        const hasil = "firstName" in orang
        document.writeln(`<p>${hasil}</p>`)
    </script>
</body>
</html>
