<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Logika</title>
</head>
<body>
    <script>
        const nilaiUjian = 90
        const nilaiAbsen = 80

        const lulusUjian = nilaiUjian > 74
        const lulusAbsen = nilaiAbsen > 74

        const lulus = lulusUjian && lulusAbsen
        document.writeln(lulus)
    </script>
</body>
</html>
