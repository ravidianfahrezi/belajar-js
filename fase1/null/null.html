<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Null</title>
</head>
<body>
    <script>
        let firstName = "halo"
        if (firstName === undefined) {
            console.info("Halo Undefined")
        } else if (firstName === null) {
            console.info("Halo Null")
        } else {
            console.info(firstName)
        }
    </script>
</body>
</html>
