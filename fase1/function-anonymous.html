<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymouse Function</title>
</head>
<body>
    <script>
        let say = function (name) {
            document.writeln(`<p>Hello ${name}</p>`)
        }

        say("Ravi")
        say("Dian")
    </script>
</body>
</html>
