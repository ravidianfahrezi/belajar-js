<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Perbandingan</title>
</head>
<body>
    <script>
        let hasil = 5 == "5"
        document.writeln(hasil + "</br>")

        hasil = 5 === "5"
        document.writeln(hasil + "</br>")

        hasil = 5 < "10"
        document.writeln(hasil + "</br>")
        
        hasil = 5 > "10"
        document.writeln(hasil + "</br>")
    </script>
</body>
</html>
