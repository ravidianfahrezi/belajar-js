<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variabel</title>
</head>
<body>
    <script>
        var fullName
        var firstName
        var middleName
        var lastName

        fullName = "Ravi Dian Fahrezi"
        firstName = "Ravi"
        middleName = "Dian"
        lastName = "Fahrezi"

        // variable let
        let firstName = "Ravi Dian Fahrezi"
        document.writeln(firstName)
        document.writeln("</br>")
    </script>
</body>
</html>
