<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan For Of</title>
</head>
<body>
    <script>
        const names = ["Ravi", "Dian", "Fahrezi"]
        for (const name of names) {
            document.writeln(`<p>${name}</p>`)
        }

        const fullName = "Ravi Dian Fahrezi"
        for (const karakter of fullName) {
            document.writeln(`<p>${karakter}</p>`)
        }
    </script>
</body>
</html>
