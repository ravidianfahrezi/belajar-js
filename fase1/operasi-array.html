<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operasi di Array</title>
</head>
<body>
    <script>
        const name = []
        name.push("Ravi")
        name.push("Dian", "Fahrezi")
        console.table(name)

        console.info(name[0])
        console.info(name[1])
        console.info(name[2])

        name[0] = "Programmer"
        name[1] = "Zaman"
        name[2] = "Now"
        console.table(name)

        delete name[2]

        console.table(name)
    </script>
</body>
</html>
