<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope</title>
</head>
<body>
    <script>
        // global scope
        let counter = 0

        // global scope
        function hitMe () {
            //local scope hitMe
            counter++
        }

        // global scope
        function other () {
            //local scope hitMe
        }

        hitMe()
        hitMe()

        console.info(counter)

        // function first () {
        //     // local scope first
        //     let firstVariable = "First"
        // }

        // function second () {
        //     // local scope second
        //     let secondVariable = "Second"
        // }

        // first()
        // second()

        // console.info(firstVariable)
        // console.info(secondVariable)

        function first () {
            let firstVariable = "First"

            function second () {
                console.info(firstVariable)
            }

            second()
        }

        first()
    </script>
</body>
</html>
