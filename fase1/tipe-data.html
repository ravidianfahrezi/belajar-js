<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tipe data</title>
</head>
<body>
    <script>
        // tipe number
        document.writeln(900)
        document.writeln("<br>")
        document.writeln(1000)
        document.writeln("<br>")
        document.writeln(0b1110110)
        document.writeln("<br>")
        document.writeln("<br>")

        // tipe bolean
        document.writeln(true)
        document.writeln("<br>")
        document.writeln(false)
        document.writeln("<br>")
        document.writeln("<br>")

        // tipe string
        document.writeln("Ravi Dian Fahrezi")
        document.writeln("<br>")
        document.writeln("nojksfnws")
        document.writeln("<br>")

        // menambah string
        document.writeln("Nama saya : " + "Ravi")
        document.writeln("<br>")
        document.writeln("<br>")

        // escape sequance
        document.writeln("<textarea cols='100' rows='10'>")
        document.write("Ravi \nDian \nFahrezi\n")
        document.write("\\Ravi \\Dian \\Fahrezi\n")
        document.write("\"Ravi \"Dian \"Fahrezi\n")
        document.write("\'Ravi \'Dian \'Fahrezi\n")
        document.write("</textarea>")
    </script>
</body>
</html>
