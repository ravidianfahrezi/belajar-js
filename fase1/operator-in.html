<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator In</title>
</head>
<body>
    <script>
        const orang = {
            firstName: "Ravi",
            lastName: "Fahrezi"
        }

        if ("firstName" in orang) {
            alert(`Halo Bg ${orang.firstName}`)
        } else {
            alert("Hello")
        }

        const student = {
            firstName: "Ravi",
            middleName: undefined,
            lastName: "Fahrezi"
        }

        if ("middleName" in student) {
            alert(`Hello ${student.middleName}`)
        } else {
            alert("halo bg")
        }

        const names = [null, "Ravi", null]
        const hasil = 0 in names
        document.writeln(`<p>${hasil}</p>`)
    </script>
</body>
</html>
